context:
  version: "3.5.2"

package:
  name: rsync
  version: ${{ version }}

source:
  url: https://github.com/RsyncProject/rsync/archive/v${{ version }}.tar.gz
  sha256: d45f58d8e148cc4c90c2f70e6d66709564fed3fe657e5bda4622a24470cc1c94

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - make
    - autoconf
    - automake
    - python >=3.10
    - commonmark
  host:
    - libiconv
    - libidn2
    - lz4-c
    - openssl
    - popt
    - xxhash
    - zstd

tests:
  - script:
      - rsync --version
      - rsync --help
  - package_contents:
      strict: true
      bin:
        - rsync
        - rsync-ssl
      files:
        - share/man/man1/rsync.1
        - share/man/man1/rsync-ssl.1
        - share/man/man5/rsyncd.conf.5

about:
  license: GPL-3.0-only
  license_file: COPYING
  summary: Tool for fast incremental file transfer
  description: |
    rsync is an open source utility that provides fast incremental file transfer.
  homepage: https://rsync.samba.org/
  repository: https://github.com/RsyncProject/rsync
  documentation: https://rsync.samba.org/documentation.html

extra:
  recipe-maintainers:
    - notestaff
    - sodre
    - xhochy
    - XhstormR
