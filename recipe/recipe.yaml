context:
  version: "3.5.1"

package:
  name: rsync
  version: ${{ version }}

source:
  url: https://github.com/RsyncProject/rsync/archive/v${{ version }}.tar.gz
  sha256: 2799008013c605cc9e83e70c1d18de6cf99e5fb4556b63f36123337d92942890

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - make
    - autoconf
    - automake
    - perl *
    - python >=3.10
    - commonmark
    - if: unix
      then: gnuconfig
    - if: osx and arm64
      then: ${{ compiler('cxx') }}
  host:
    - libiconv
    - libidn2
    - lz4-c
    - openssl
    - popt
    - xxhash
    - zlib
    - zstd

tests:
  - script:
      - rsync --version
      - rsync --help
  - package_contents:
      strict: true
      bin:
        - rsync
        - rsync-ssl
      files:
        - share/man/man1/rsync.1
        - share/man/man1/rsync-ssl.1
        - share/man/man5/rsyncd.conf.5

about:
  license: GPL-3.0-only
  license_file: COPYING
  summary: Tool for fast incremental file transfer
  description: |
    rsync is an open source utility that provides fast incremental file transfer.
  homepage: https://rsync.samba.org/
  repository: https://github.com/RsyncProject/rsync
  documentation: https://rsync.samba.org/documentation.html

extra:
  recipe-maintainers:
    - notestaff
    - sodre
    - xhochy
    - XhstormR
